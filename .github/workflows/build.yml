name: Build Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build extension APK
        run: ./gradlew :extension:assembleRelease --no-daemon
        continue-on-error: true

      - name: Find and rename APK
        run: |
          mkdir -p repo
          APK=$(find extension/build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "repo/aniyomi-br.meusanimes-v1.0.0.apk"
            echo "APK_BUILT=true" >> $GITHUB_ENV
          else
            echo "APK_BUILT=false" >> $GITHUB_ENV
            echo "No APK found - build failed"
          fi
          ls -la repo/ 2>/dev/null || echo "repo/ empty"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: env.APK_BUILT == 'true'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MeusAnimesBlog v1.0.${{ github.run_number }}
          files: repo/aniyomi-br.meusanimes-v1.0.0.apk
          generate_release_notes: true
