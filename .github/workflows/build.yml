name: Build Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout build system (cursedyomi-extensions)
        uses: actions/checkout@v4
        with:
          repository: Claudemirovsky/cursedyomi-extensions
          ref: master
          path: build-system

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy extension source to build system
        run: |
          rm -rf build-system/src/*
          mkdir -p build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes
          cp -r extension/src/main/java/eu/kanade/tachiyomi/animeextension/br/meusanimes/* build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/
          cp extension/src/main/AndroidManifest.xml build-system/src/pt/meusanimes/
          cat > build-system/src/pt/meusanimes/build.gradle << 'GRADLE'
          ext {
              extName = 'Meus Animes'
              extClass = '.MeusAnimesBlog'
              extVersionCode = 1
          }
          apply from: "$rootDir/common.gradle"
          GRADLE

      - name: Fix package references in source
        run: |
          sed -i 's/package eu.kanade.tachiyomi.animeextension.br.meusanimes/package eu.kanade.tachiyomi.animeextension.pt.meusanimes/g' \
            build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/*.kt

      - name: Build APK
        working-directory: build-system
        env:
          CI_CHUNK_SIZE: "100"
          CI_CHUNK_NUM: "0"
        run: ./gradlew -p src :src:pt:meusanimes:assembleDebug --stacktrace

      - name: Capture error log on failure
        if: failure()
        run: |
          mkdir -p repo
          find build-system -name "*.log" -path "*/kotlin/*" | head -5 | while read f; do
            echo "=== $f ===" >> repo/gradle-error.log
            cat "$f" >> repo/gradle-error.log
          done
          find build-system -name "*.txt" -path "*/reports/*" | head -5 | while read f; do
            echo "=== $f ===" >> repo/gradle-error.log
            cat "$f" >> repo/gradle-error.log
          done
          # Also try getting the build output
          echo "=== Tasks that failed ===" >> repo/gradle-error.log
          find build-system -name "output.txt" -o -name "*.out" | head -5 | while read f; do
            tail -50 "$f" >> repo/gradle-error.log 2>/dev/null || true
          done

      - name: Push debug error log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin debug-gradle-log || git checkout --orphan debug-gradle-log
          git checkout debug-gradle-log 2>/dev/null || git checkout --orphan debug-gradle-log
          if [ -f repo/gradle-error.log ]; then
            cp repo/gradle-error.log gradle-error.log
            git add gradle-error.log
            git commit -m "debug: update build error log"
            git push origin debug-gradle-log --force
          fi
          git checkout main

      - name: Copy APK to repo
        if: success()
        run: |
          rm -f repo/apk/*.apk
          mkdir -p repo/apk repo/icon
          apk=$(find build-system -name "*.apk" -type f | head -1)
          echo "Found APK: $apk"
          cp "$apk" repo/apk/aniyomi-pt.meusanimes-v14.1.apk

      - name: Commit and push APK
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add repo/
          git diff --cached --quiet || git commit -m "chore: update APK"
          git push
