name: Build Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build extension APK
        run: ./gradlew :extension:assembleRelease --no-daemon
        continue-on-error: true

      - name: Find and rename APK
        run: |
          find extension/build -name "*.apk" -type f 2>/dev/null | head -5
          APK=$(find extension/build -name "*-release-unsigned.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "repo/aniyomi-br.meusanimes-v1.0.0.apk"
            echo "APK copied to repo/"
          else
            # Try finding any APK
            APK=$(find extension/build -name "*.apk" -type f 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "repo/aniyomi-br.meusanimes-v1.0.0.apk"
              echo "APK copied (fallback)"
            else
              echo "No APK found - build may have failed"
              # Create placeholder so index works
              echo "placeholder" > "repo/aniyomi-br.meusanimes-v1.0.0.apk"
            fi
          fi
          ls -la repo/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MeusAnimesBlog v1.0.${{ github.run_number }}
          files: repo/aniyomi-br.meusanimes-v1.0.0.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
