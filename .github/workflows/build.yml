name: Build Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build extension APK
        run: ./gradlew :extension:assembleRelease --no-daemon

      - name: Sign APK
        run: |
          APK="extension/build/outputs/apk/release/extension-release-unsigned.apk"
          SIGNED="extension/build/outputs/apk/release/MeusAnimesBlog.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "$SIGNED"
          else
            # Try finding the APK
            find extension/build -name "*.apk" -exec cp {} "$SIGNED" \;
          fi
          ls -la "$SIGNED" || echo "APK not found!"

      - name: Generate repo index
        run: |
          mkdir -p repo
          if [ -f "extension/build/outputs/apk/release/MeusAnimesBlog.apk" ]; then
            cp extension/build/outputs/apk/release/MeusAnimesBlog.apk repo/
          fi
          if [ -f "repo/MeusAnimesBlog.apk" ]; then
            APK_HASH=$(sha256sum repo/MeusAnimesBlog.apk | cut -d' ' -f1)
            APK_SIZE=$(stat -c%s repo/MeusAnimesBlog.apk)
          else
            APK_HASH="placeholder"
            APK_SIZE="0"
          fi
          cat > repo/index.min.json << 'JSONEOF'
          [
            {
              "name": "MeusAnimesBlog",
              "pkg": "eu.kanade.tachiyomi.anime.br.meusanimes",
              "apk": "https://github.com/fundacaom175-netizen/extensions-meusanimes/releases/latest/download/MeusAnimesBlog.apk",
              "lang": "pt-BR",
              "code": 1,
              "version": "1.0.0",
              "sources": [
                {
                  "name": "Meus Animes",
                  "lang": "pt-BR",
                  "id": 123456789,
                  "baseUrl": "https://meusanimes.blog",
                  "version": "1.0.0"
                }
              ]
            }
          ]
          JSONEOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MeusAnimesBlog v1.0.${{ github.run_number }}
          files: repo/MeusAnimesBlog.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
