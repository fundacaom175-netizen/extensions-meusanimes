name: Build Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout build system (cursedyomi-extensions)
        uses: actions/checkout@v4
        with:
          repository: Claudemirovsky/cursedyomi-extensions
          ref: master
          path: build-system

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install additional SDK platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" || true

      - name: Upgrade only extensions-lib to v16 for Hoster API support
        run: |
          sed -i 's/version = "14"/version = "v16"/' build-system/gradle/libs.versions.toml

      - name: Copy extension source to build system
        run: |
          rm -rf build-system/src/*
          mkdir -p build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes
          cp -r extension/src/main/java/eu/kanade/tachiyomi/animeextension/br/meusanimes/* build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/
          cp extension/src/main/AndroidManifest.xml build-system/src/pt/meusanimes/
          cat > build-system/src/pt/meusanimes/build.gradle << 'GRADLE'
          ext {
              extName = 'Meus Animes'
              extClass = '.MeusAnimesBlog'
              extVersionCode = 1
          }
          apply from: "$rootDir/common.gradle"

          GRADLE

      - name: Fix package references in source
        run: |
          sed -i 's/package eu.kanade.tachiyomi.animeextension.br.meusanimes/package eu.kanade.tachiyomi.animeextension.pt.meusanimes/g' \
            build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/*.kt

      - name: Build APK
        working-directory: build-system
        env:
          CI_CHUNK_SIZE: "100"
          CI_CHUNK_NUM: "0"
        continue-on-error: true
        run: |
          ./gradlew -p src :src:pt:meusanimes:assembleDebug --stacktrace -x lintKotlin > /tmp/gradle.log 2>&1 || true

      - name: Commit error log to debug branch if build failed
        if: always()
        run: |
          apk=$(find build-system -name "*.apk" -type f | head -1)
          if [ -z "$apk" ]; then
            echo "Build failed. Committing error log to debug-gradle-log branch..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan debug-gradle-log
            git rm -rf .
            cp /tmp/gradle.log gradle-error.log
            git add gradle-error.log
            git commit -m "debug: gradle error log"
            git push origin debug-gradle-log --force
          else
            echo "APK found: $apk - build succeeded"
          fi

      - name: Copy APK to repo
        run: |
          rm -f repo/apk/*.apk
          mkdir -p repo/apk repo/icon
          apk=$(find build-system -name "*.apk" -type f | head -1)
          echo "Found APK: $apk"
          cp "$apk" repo/apk/aniyomi-pt.meusanimes-v14.1.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add repo/
          git diff --cached --quiet || git commit -m "chore: update APK"
          git push
