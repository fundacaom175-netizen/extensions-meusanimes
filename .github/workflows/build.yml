name: Build All Extensions

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout build system (cursedyomi-extensions)
        uses: actions/checkout@v4
        with:
          repository: Claudemirovsky/cursedyomi-extensions
          ref: master
          path: build-system

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy MeusAnimes extension source to build system
        run: |
          rm -rf build-system/src/*
          mkdir -p build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes
          cp -r extension/src/main/java/eu/kanade/tachiyomi/animeextension/br/meusanimes/* \
            build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/
          cp extension/src/main/AndroidManifest.xml build-system/src/pt/meusanimes/
          cat > build-system/src/pt/meusanimes/build.gradle << 'GRADLE'
          ext {
              extName = 'Meus Animes'
              extClass = '.MeusAnimesBlog'
              extVersionCode = 1
          }
          apply from: "$rootDir/common.gradle"
          GRADLE

      - name: Fix package references in MeusAnimes source
        run: |
          sed -i 's/package eu.kanade.tachiyomi.animeextension.br.meusanimes/package eu.kanade.tachiyomi.animeextension.pt.meusanimes/g' \
            build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/*.kt

      - name: Copy all other extensions
        run: |
          for ext in anitube hinatasoul betteranime rinecloud animesdigital animefire; do
            echo "--- Copying $ext ---"
            mkdir -p build-system/src/pt/$ext
            cp extension/pt/$ext/build.gradle build-system/src/pt/$ext/
            [ -f extension/pt/$ext/AndroidManifest.xml ] && cp extension/pt/$ext/AndroidManifest.xml build-system/src/pt/$ext/
            [ -d extension/pt/$ext/src/main/res ] && cp -r extension/pt/$ext/src/main/res build-system/src/pt/$ext/res
            mkdir -p build-system/src/pt/$ext/src/eu/kanade/tachiyomi/animeextension/pt/$ext
            cp -r extension/pt/$ext/src/main/java/eu/kanade/tachiyomi/animeextension/pt/$ext/* \
              build-system/src/pt/$ext/src/eu/kanade/tachiyomi/animeextension/pt/$ext/
          done

      - name: Add skip metadata version check
        run: |
          sed -i '/freeCompilerArgs += /a\        freeCompilerArgs += "-Xskip-metadata-version-check"' build-system/common.gradle
          sed -i '/freeCompilerArgs += /a\        freeCompilerArgs += "-Xskip-metadata-version-check"' build-system/buildSrc/src/main/kotlin/lib-multisrc.gradle.kts

      - name: Build all APKs
        working-directory: build-system
        run: |
          set +e
          RESULTS=""
          for ext in meusanimes anitube hinatasoul betteranime rinecloud animesdigital animefire; do
            echo "=== Building $ext ==="
            ./gradlew -p src :src:pt:$ext:assembleDebug --stacktrace 2>&1
            if [ $? -eq 0 ]; then
              echo "=== SUCCESS: $ext ==="
              RESULTS="$RESULTS ✅ $ext"
            else
              echo "=== FAILED: $ext ==="
              RESULTS="$RESULTS ❌ $ext"
            fi
          done
          echo "========== RESULTS =========="
          echo "$RESULTS"
          echo "============================="

      - name: Copy APKs and icons to repo
        run: |
          rm -rf repo/apk repo/icon
          mkdir -p repo/apk repo/icon
          echo "=== Searching for APKs in build-system ==="
          find build-system -name "*.apk" -type f 2>/dev/null
          for apk_path in $(find build-system -name "*.apk" -type f 2>/dev/null); do
            echo "Processing: $apk_path"
            base=$(basename "$apk_path")
            clean_name=$(echo "$base" | sed 's/-debug//')
            dest="repo/apk/$clean_name"
            echo "Copy: $apk_path -> $dest"
            cp "$apk_path" "$dest"
          done
          for ext in anitube hinatasoul betteranime rinecloud animesdigital animefire; do
            icon_dir="repo/icon/$ext"
            for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              src="extension/pt/$ext/src/main/res/mipmap-${size}/ic_launcher.png"
              if [ -f "$src" ]; then
                mkdir -p "$icon_dir/mipmap-$size"
                cp "$src" "$icon_dir/mipmap-$size/"
              fi
            done
            src="extension/pt/$ext/src/main/res/web_hi_res_512.png"
            [ -f "$src" ] && cp "$src" "$icon_dir/"
          done
          echo "=== APKs in repo ==="
          ls -la repo/apk/
          echo "=== Contents of repo/ ==="
          find repo/ -type f

      - name: Commit and push APKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add repo/
          echo "=== Staged changes ==="
          git diff --cached --stat
          git diff --cached --quiet
          staged=$?
          if [ $staged -eq 0 ]; then
            echo "No changes to commit."
          else
            git commit -m "chore: update APKs"
            git push
            echo "Committed and pushed."
          fi
