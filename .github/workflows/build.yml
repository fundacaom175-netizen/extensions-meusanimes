name: Build Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout build system (cursedyomi-extensions)
        uses: actions/checkout@v4
        with:
          repository: Claudemirovsky/cursedyomi-extensions
          ref: master
          path: build-system

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Upgrade Kotlin and extensions-lib for Hoster API support
        run: |
          sed -i 's/kotlin_version = "2.0.20"/kotlin_version = "2.2.0"/' build-system/gradle/libs.versions.toml
          sed -i 's/serialization_version = "1.7.3"/serialization_version = "1.9.0"/' build-system/gradle/libs.versions.toml
          sed -i 's/version = "14"/version = "v16"/' build-system/gradle/libs.versions.toml

      - name: Copy extension source to build system
        run: |
          rm -rf build-system/src/*
          mkdir -p build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes
          cp -r extension/src/main/java/eu/kanade/tachiyomi/animeextension/br/meusanimes/* build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/
          cp extension/src/main/AndroidManifest.xml build-system/src/pt/meusanimes/
          cat > build-system/src/pt/meusanimes/build.gradle << 'GRADLE'
          ext {
              extName = 'Meus Animes'
              extClass = '.MeusAnimesBlog'
              extVersionCode = 1
          }
          apply from: "$rootDir/common.gradle"
          GRADLE

      - name: Fix package references in source
        run: |
          sed -i 's/package eu.kanade.tachiyomi.animeextension.br.meusanimes/package eu.kanade.tachiyomi.animeextension.pt.meusanimes/g' \
            build-system/src/pt/meusanimes/src/eu/kanade/tachiyomi/animeextension/pt/meusanimes/*.kt

      - name: Build APK
        working-directory: build-system
        env:
          CI_CHUNK_SIZE: "100"
          CI_CHUNK_NUM: "0"
        continue-on-error: true
        run: ./gradlew -p src :src:pt:meusanimes:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Show build errors
        if: always()
        working-directory: build-system
        run: |
          echo "::group::BUILD ERRORS"
          grep -n "e:\|error:\|Error:\|FAILED\|Exception\|Unresolved\|unresolved\|cannot find symbol\|does not override" /tmp/gradle.log | head -30 | while read line; do echo "::error::$line"; done
          echo "::endgroup::"
          echo "::group::GRADLE FAILURE"
          grep -A5 "FAILURE:" /tmp/gradle.log | head -20
          echo "::endgroup::"
          echo "::group::TAIL"
          tail -30 /tmp/gradle.log
          echo "::endgroup::"

      - name: Copy APK to repo
        run: |
          rm -f repo/apk/*.apk
          mkdir -p repo/apk repo/icon
          apk=$(find build-system -name "*.apk" -type f | head -1)
          echo "Found APK: $apk"
          cp "$apk" repo/apk/aniyomi-pt.meusanimes-v14.1.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add repo/
          git diff --cached --quiet || git commit -m "chore: update APK"
          git push
